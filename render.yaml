services:
  - type: web
    name: ultrarem-site
    runtime: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: redirect
        source: /percorsi
        destination: /come-funziona
      - type: redirect
        source: /incontra
        destination: /il-progetto
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
